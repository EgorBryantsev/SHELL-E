# ==================================================================================
# nav2_params.yaml (Corrected Structure for ROS 2 Humble/Launch System)
# ==================================================================================

# --- Controller Server (Local Planner) ---
controller_server:
  ros__parameters:
    use_sim_time: True

    # Tell the controller server which plugins it will own
    controller_plugins: ["FollowPath"]

    # ─────────────────────────────────────────────────────────────
    # Plugin namespace  (alias)        ↓
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      # Kinematics (note the *_vel_* names)
      min_vel_x:        0.0
      max_vel_x:        0.26
      max_vel_theta:    1.82
      min_vel_theta:   -1.82
      acc_lim_x:        2.5
      acc_lim_theta:    3.2
      decel_lim_x:      2.5
      decel_lim_theta:  3.2
      vx_samples:       20
      vtheta_samples:   20
      controller_frequency: 20.0
      robot_radius:     0.12

      # List of critics (strings only)
      critics: ["GoalDist", "PathDist", "GoalAlign", "PathAlign", "ObstacleFootprint"]

      # One mini-namespace per critic
      GoalDist:
        plugin: "dwb_critics::GoalDistCritic"
        scale: 32.0
      PathDist:
        plugin: "dwb_critics::PathDistCritic"
        scale: 32.0
      GoalAlign:
        plugin: "dwb_critics::GoalAlignCritic"
        scale: 24.0
      PathAlign:
        plugin: "dwb_critics::PathAlignCritic"
        scale: 24.0
      ObstacleFootprint:
        plugin: "dwb_critics::ObstacleFootprintCritic"
        scale: 0.01

# --- Planner Server (Global Planner) ---
planner_server:
  ros__parameters:
    use_sim_time: True
    # The default planner is NavFn, which is usually fine to start with.
    # We can leave its parameters as default.

# --- AMCL (Localization) ---
amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    transform_tolerance: 1.0
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    # Set this to true to use the map topic published by the map_server
    use_map_topic: True

# --- Map Server ---
map_server:
  ros__parameters:
    use_sim_time: True
    # This is handled by the launch file, but it's good practice to keep it here.
    yaml_filename: "map.yaml"

# --- Behavior Server ---
behavior_server:
  ros__parameters:
    use_sim_time: True
    # Default behaviors are usually sufficient to start.

# --- BT Navigator (Behavior Tree Navigator) ---
bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: "map"
    robot_base_frame: "base_footprint"
    # This behavior tree allows for path replanning and recovery actions
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"

# --- Waypoint Follower ---
waypoint_follower:
  ros__parameters:
    use_sim_time: True
    # Default parameters are fine for now.

# --- Smoother Server ---
smoother_server:
  ros__parameters:
    use_sim_time: True
    # Default parameters are fine for now.

# --- Velocity Smoother ---
velocity_smoother:
  ros__parameters:
    use_sim_time: True
    # Default parameters are fine for now.

# --- Lifecycle Manager Settings ---
# These manage the startup/shutdown of all the other nodes
lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: True
    node_names: ['map_server', 'amcl']

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: True
    node_names:
      - 'controller_server'
      - 'planner_server'
      - 'behavior_server'
      - 'bt_navigator'
      - 'waypoint_follower'
      - 'velocity_smoother'